name: saga
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip=24
  - numpy=1.26.*
  - plyfile=0.8.1
  - tqdm
  - scikit-learn
  - hdbscan
  - matplotlib
  - joblib=1.1.0
  - ninja
  - cmake
  - setuptools
  - wheel

  - pip:
    - --index-url https://download.pytorch.org/whl/cu124
    - --extra-index-url https://pypi.org/simple
    - numpy<2
    - torch==2.4.0
    - torchvision==0.19.0
    - torchaudio==2.4.0
    - git+https://github.com/facebookresearch/segment-anything.git
    - dearpygui
    - opencv-python
    - open-clip-torch
